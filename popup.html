<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sodium</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 280px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f0f0f;
        color: #f1f1f1;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 16px 12px;
        border-bottom: 1px solid #272727;
      }

      .header-icon {
        width: 28px;
        height: 28px;
        background: #ff0000;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
      }

      .header-title {
        font-size: 14px;
        font-weight: 600;
        color: #f1f1f1;
      }

      .header-subtitle {
        font-size: 11px;
        color: #aaa;
        margin-top: 1px;
      }

      /* Toggle row */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
      }

      .toggle-label-group {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .toggle-label {
        font-size: 13px;
        font-weight: 500;
        color: #f1f1f1;
      }

      .toggle-status {
        font-size: 11px;
        color: #aaa;
      }

      .toggle-status.active {
        color: #4caf50;
      }

      /* Toggle switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
        flex-shrink: 0;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: #3a3a3a;
        border-radius: 24px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        top: 3px;
        background: #888;
        border-radius: 50%;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      .switch input:checked + .slider {
        background: #1a3a1a;
      }

      .switch input:checked + .slider::before {
        transform: translateX(20px);
        background: #4caf50;
      }

      .switch input:focus-visible + .slider {
        outline: 2px solid #4caf50;
        outline-offset: 2px;
      }

      /* Footer */
      .footer {
        padding: 10px 16px 14px;
        border-top: 1px solid #272727;
        font-size: 10px;
        color: #555;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-icon">S</div>
      <div>
        <div class="header-title">Sodium</div>
        <div class="header-subtitle">YouTube Productivity</div>
      </div>
    </div>

    <div class="toggle-row">
      <div class="toggle-label-group">
        <span class="toggle-label">Hide Shorts</span>
        <span class="toggle-status" id="status-text">Loading...</span>
      </div>
      <label class="switch" aria-label="Toggle Shorts visibility">
        <input type="checkbox" id="shorts-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="footer">Changes apply instantly — no refresh needed</div>

    <script src="popup.js"></script>
  </body>
</html>
